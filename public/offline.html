<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scorer — fără internet</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: linear-gradient(180deg, #0B2A1C, #07160F); color: #F3EFE6; text-align: center; padding: 24px; }
  img { width: 72px; height: 72px; border-radius: 20px; }
  h1 { font-size: 26px; margin: 20px 0 8px; letter-spacing: -0.02em; }
  p { color: rgba(243,239,230,.65); margin: 0 0 24px; }
  button { background: #F3EFE6; color: #07160F; border: 0; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="" />
    <h1>Nu ești conectat la internet</h1>
    <p>Rezervările au nevoie de internet. Verifică conexiunea și încearcă din nou.</p>
    <button onclick="location.reload()">Încearcă din nou</button>
  </main>
</body>
</html>
